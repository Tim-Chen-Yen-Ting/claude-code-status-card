<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #container {
    width: 240px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 8px;
    padding: 4px;
    max-height: 100vh;
    overflow-y: auto;
  }
  #container::-webkit-scrollbar { width: 0; }
  .card {
    position: relative;
    box-sizing: border-box;
    border-radius: 16px; padding: 10px 12px;
    background: rgba(28,28,32,0.92);
    color: #eee;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    transition: background 0.25s, box-shadow 0.25s, opacity 0.4s;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card.needs-approval {
    background: rgba(120,20,20,0.95);
    box-shadow: 0 0 0 2px rgba(255,80,80,0.8), 0 4px 24px rgba(0,0,0,0.5);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,80,80,0.9), 0 4px 24px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(255,80,80,0.3), 0 4px 24px rgba(0,0,0,0.5); }
  }
  .row { display: flex; align-items: flex-start; gap: 11px; }
  .repoicon { flex: 0 0 auto; width: 30px; height: 30px; margin-top: 1px; cursor: pointer; border-radius: 8px; }
  .repoicon:hover { background: rgba(255,255,255,0.12); }
  .repoicon svg { width: 30px; height: 30px; display: block; }
  .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; line-height: 1; }
  .status.working { color: #3b82f6; }
  .status.approval { color: #ef4444; }
  .status.done { color: #22c55e; }
  .ind { width: 15px; height: 15px; flex: 0 0 auto; display: block; }
  .spinner {
    width: 14px; height: 14px; box-sizing: border-box;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .name {
    font-size: 13px; color: #eee; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cwd {
    font-size: 11px; color: #8a8a8a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .close {
    position: absolute; top: 6px; right: 8px;
    width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 50%; font-size: 12px; color: #ccc;
    background: rgba(255,255,255,0.08);
    cursor: pointer; opacity: 0.55;
  }
  .close:hover { opacity: 1; background: rgba(255,80,80,0.85); color: #fff; }
  #empty {
    position: relative;
    box-sizing: border-box;
    border-radius: 16px; padding: 14px 12px;
    background: rgba(28,28,32,0.92);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    font-size: 11px; color: #999; text-align: center;
  }
  #quit {
    position: absolute; top: 6px; right: 8px;
    width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 50%; font-size: 12px; color: #ccc;
    background: rgba(255,255,255,0.08);
    cursor: pointer; opacity: 0.55;
  }
  #quit:hover { opacity: 1; background: rgba(255,80,80,0.85); color: #fff; }
</style>
</head>
<body>
  <div id="container">
    <div id="empty"><span id="quit" title="Quit widget">⏻</span>Idle — no active sessions</div>
  </div>

<script>
  const container = document.getElementById("container");
  const emptyEl = document.getElementById("empty");

  // Retire a session's card this long after it reports Stop, unless it
  // emits a new event first (e.g. the next prompt in the same session).
  const RETIRE_AFTER_MS = 5 * 60 * 1000;

  // A tool that needs approval fires PreToolUse but no PostToolUse until you
  // approve. Claude Code's Notification hook often doesn't fire for these,
  // so if a "Running tool" card sees no follow-up event within a window, we
  // escalate it to the red "Needs you?" state. Per Claude Code's permission
  // docs (code.claude.com/docs/en/permissions,
  // code.claude.com/docs/en/tools-reference), Bash and WebSearch are the
  // tools that actually re-prompt often: Bash approval is remembered
  // permanently per repo+exact command (so any new command re-asks), and
  // WebSearch has no session-level "always allow" at all, so it can prompt
  // on nearly every call. Edit/Write/NotebookEdit approval, by contrast,
  // lasts until session end (so only the first one in a session can be
  // gated) and WebFetch only prompts on the first hit to a new domain — both
  // routinely take longer than a few seconds on big files/pages without ever
  // needing approval again. So Bash/WebSearch get a short fuse and
  // everything else a long one, instead of one threshold that either
  // false-positives on slow edits or is too slow to catch a real prompt.
  //
  // The Bash/WebSearch fuse can't be too short, though: every hook spawns a
  // fresh `node hook-relay.cjs` process, and there's a PreToolUse -> tool
  // runs -> PostToolUse round-trip through Claude Code itself in between.
  // On Windows, cold Node process-spawn overhead alone can eat well past a
  // second, especially under load (several hooks firing back to back) —
  // observed false-positiving an auto-approved, no-prompt `ls` at 1500ms.
  // 3500ms gives headroom against that while still being much faster than
  // the 15s default.
  const APPROVAL_HINT_MS_BY_TOOL = { Bash: 3500, WebSearch: 3500 };
  const APPROVAL_HINT_MS_DEFAULT = 15000;
  function approvalHintMsFor(toolName) {
    return APPROVAL_HINT_MS_BY_TOOL[toolName] ?? APPROVAL_HINT_MS_DEFAULT;
  }

  // --- Known-safe Bash commands (skip the approval-hint timer entirely) --
  // Claude Code recognizes a fixed, undocumented-as-configurable set of
  // read-only Bash commands and runs them without ever prompting, in every
  // permission mode (code.claude.com/docs/en/permissions#read-only-commands).
  // For a command we can positively identify as being in that set, there is
  // no approval to wait for, so we skip setting a hint timer at all instead
  // of guessing a timeout — eliminating false-positive red flashes for
  // ordinary lookups like `ls`/`cat`/`pwd` regardless of how slow the hook
  // round-trip happens to be.
  //
  // This match is deliberately conservative: Claude Code's real analysis
  // handles glob expansion, compound commands, and per-command exceptions
  // (see the docs link above) that we can't fully reproduce from a command
  // string alone. So this only fires for the simple, unambiguous case — a
  // single invocation, no chaining/substitution/redirection, no glob
  // characters, and a leading command word in the fixed list below. `git`
  // and `find` are deliberately excluded even though the docs list them as
  // usually-read-only: a `git` invocation's read-only-ness depends on the
  // subcommand, and `find` has destructive flags (`-delete`, `-exec`) that
  // make it non-read-only with no glob involved at all — both too easy to
  // get wrong from a command string alone. Anything not confidently matched
  // falls back to the normal per-tool timer above, same as before this
  // existed — so the failure mode for a command we're unsure about is
  // "waits a bit longer to flag", never "silently never flags".
  const READ_ONLY_BASH_COMMANDS = new Set([
    "ls", "cat", "echo", "pwd", "head", "tail", "grep", "wc", "which", "diff", "stat", "du", "cd",
  ]);
  // Chaining (&&, ||, ;, |), command substitution ($(...), `...`), and
  // redirection (>, <) all make a "simple single command" analysis
  // unreliable, so any of these bails out to the normal timer.
  const BASH_COMPLEXITY_RE = /&&|\|\||[|;`]|\$\(|[<>]/;
  // Unquoted glob metacharacters — even for commands in the safe list, Claude
  // Code's own doc calls out that a glob is only skipped when every flag is
  // read-only, which we can't verify; treat any glob as "not simple".
  const BASH_GLOB_RE = /[*?[]/;
  function isKnownReadOnlyBash(command) {
    if (!command || typeof command !== "string") return false;
    const trimmed = command.trim();
    if (!trimmed || BASH_COMPLEXITY_RE.test(trimmed) || BASH_GLOB_RE.test(trimmed)) return false;
    const tokens = trimmed.split(/\s+/);
    // Skip leading env-var assignments, e.g. `FOO=bar ls`.
    let i = 0;
    while (i < tokens.length && /^[A-Za-z_][A-Za-z0-9_]*=/.test(tokens[i])) i++;
    const lead = tokens[i];
    return !!lead && READ_ONLY_BASH_COMMANDS.has(lead);
  }

  // session_id -> { cwd, kind, label, detail, ts, retireAt }
  const sessions = new Map();
  // session_id -> timeout id for the pending approval-hint escalation
  const hintTimers = new Map();

  function clearHint(key) {
    const t = hintTimers.get(key);
    if (t) { clearTimeout(t); hintTimers.delete(key); }
  }

  function escalateToApproval(key) {
    hintTimers.delete(key);
    const s = sessions.get(key);
    if (!s || s.kind !== "tool") return; // a later event already moved it on
    const prevKind = s.kind;
    s.kind = "approval";
    s.label = "Needs you?";
    s.detail = "Waiting to run " + (s.detail || "a tool");
    playTransitionSound(prevKind, s.kind);
    render();
  }

  function sessionKey(ev) {
    return ev.session_id || `cwd:${ev.cwd || "unknown"}`;
  }

  // --- Repository icons ---------------------------------------------------
  // Icons represent repositories, not sessions: sessions in the same repo
  // share an icon. Colour is still a deterministic hash of the repo path
  // (stable, no persistence needed — collisions there are harmless since the
  // repo-name label and icon shape already disambiguate).
  //
  // Icon *shape* assignment is sequential and persisted, not hashed: the
  // first-seen repo gets icon 0, the second gets icon 1, and so on, wrapping
  // only once every icon has been used at least once. That guarantees no two
  // repos share an icon until the pool (one per file in assets/icons/) is
  // exhausted, and even then a wrapped repo lands on the *first* icon in the
  // cycle, never the one the immediately-preceding repo just got. A pure
  // hash (the old scheme) couldn't promise that — two arbitrary repo paths
  // had a real chance of hashing to the same icon well before the pool was
  // full. The assignment is persisted to `~/.claude-status-card/icon-map.json`
  // via preload.js, so it survives widget restarts, and hand-editing that
  // file's `assignments` object is the manual-override entry point (pin a
  // repo to a specific icon, or swap two repos' icons) — see the README.
  const ICON_NAMES = Object.keys(window.pip.icons || {}).sort();
  const iconAssignments = { ...(window.pip.iconMap && window.pip.iconMap.assignments) };
  let nextIconIndex = (window.pip.iconMap && window.pip.iconMap.nextIndex) || 0;

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // Normalize the repo key before hashing/assigning so the icon/colour never
  // changes for the same repo. Claude Code reports the drive letter with
  // inconsistent case (d:/… vs D:/…), and keying on the raw string would
  // flip the icon/hue between events. Lowercasing pins it.
  function repoKey(repo) {
    return (repo || "?").toLowerCase();
  }
  function iconNameFor(repo) {
    if (!ICON_NAMES.length) return null;
    const key = repoKey(repo);
    if (iconAssignments[key]) return iconAssignments[key];
    const name = ICON_NAMES[nextIconIndex % ICON_NAMES.length];
    nextIconIndex++;
    iconAssignments[key] = name;
    if (window.pip.saveIconMap) {
      window.pip.saveIconMap({ assignments: iconAssignments, nextIndex: nextIconIndex });
    }
    return name;
  }
  function iconSvgFor(repo) {
    const name = iconNameFor(repo);
    if (!name) {
      return '<svg class="ind" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>';
    }
    return window.pip.icons[name];
  }
  function iconColorFor(repo) {
    // Deterministic per-repo hue at high lightness so it always reads clearly
    // on the dark card (never dark/gray/black).
    return `hsl(${hashStr("hue:" + repoKey(repo)) % 360} 60% 72%)`;
  }

  // --- Audio cues -----------------------------------------------------------
  // Plays alongside the existing visual states, so a red/green card grabs
  // attention even if you're not looking at the screen. Loaded once at
  // startup; `.currentTime = 0` before each play lets a sound retrigger
  // immediately even if the previous playback hasn't finished (e.g. two
  // sessions finish back to back). `Audio.volume` defaults to 1.0, which is
  // a multiplier *relative to* the system's current output level, not an
  // absolute value — so this never assumes or overrides the user's actual
  // volume (no surprise loud sounds in a quiet room).
  const SOUND_APPROVAL = new Audio("../assets/sound/approval.mp3");
  const SOUND_DONE = new Audio("../assets/sound/finish.mp3");
  function playSound(audio) {
    try {
      audio.currentTime = 0;
      // .play() rejects if the file is missing/unsupported (e.g.
      // approval.mp3 not added yet) or on a transient autoplay restriction —
      // never let that surface as an unhandled rejection or block rendering.
      audio.play().catch(() => {});
    } catch (_) {}
  }
  // Only on a genuine transition into approval/done (not a re-render of an
  // already-approval/done card, and not any other transition) — otherwise
  // e.g. the periodic retirement sweep or an unrelated event would replay it.
  function playTransitionSound(prevKind, newKind) {
    if (newKind === prevKind) return;
    if (newKind === "approval") playSound(SOUND_APPROVAL);
    else if (newKind === "done") playSound(SOUND_DONE);
  }

  // --- Status indicator (three visible states) ----------------------------
  const CHECK_SVG = '<svg class="ind" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4 10-11"/></svg>';
  const BANG_SVG = '<svg class="ind" viewBox="0 0 24 24"><g fill="currentColor"><rect x="6" y="4" width="3" height="10" rx="1.5"/><circle cx="7.5" cy="18.5" r="1.8"/><rect x="15" y="4" width="3" height="10" rx="1.5"/><circle cx="16.5" cy="18.5" r="1.8"/></g></svg>';
  const SPINNER = '<span class="spinner"></span>';

  function statusFor(kind) {
    if (kind === "approval") return { cls: "approval", label: "Needs Approval", ind: BANG_SVG };
    if (kind === "done") return { cls: "done", label: "Done", ind: CHECK_SVG };
    return { cls: "working", label: "Working", ind: SPINNER }; // working + tool
  }

  function applyEvent(ev) {
    const key = sessionKey(ev);
    // Any new event for this session means it's no longer stuck waiting, so
    // cancel a pending approval-hint escalation.
    clearHint(key);
    const existing = sessions.get(key) || {};
    const prevKind = existing.kind;
    // Pin to the session's first-ever reported cwd (typically from
    // UserPromptSubmit, which is always the session's real root) rather
    // than always taking the newest one — a later PreToolUse/PostToolUse can
    // report a subdirectory the assistant is currently working in, which
    // would otherwise silently drift the repo identity mid-session.
    const cwd = existing.cwd || ev.cwd || "";
    // Use the latest prompt as the session's display name — refreshes each
    // turn so the card reflects what the thread is doing right now.
    const name = ev.prompt || existing.name || "";
    const base = { cwd, name, ts: ev.ts };

    let newState;
    switch (ev.event) {
      case "UserPromptSubmit":
        newState = { ...base, kind: "working", label: "Thinking…", detail: "", retireAt: null };
        break;
      case "PreToolUse":
        newState = { ...base, kind: "tool", label: "Running tool", detail: ev.tool_name || "", retireAt: null };
        // Known-safe Bash commands never prompt, so there's no approval to
        // wait for — skip the hint timer instead of guessing a timeout.
        if (ev.tool_name !== "Bash" || !isKnownReadOnlyBash(ev.command)) {
          // If no follow-up arrives soon, assume it's blocked on approval.
          hintTimers.set(key, setTimeout(() => escalateToApproval(key), approvalHintMsFor(ev.tool_name)));
        }
        break;
      case "PostToolUse":
        newState = { ...base, kind: "working", label: "Thinking…", detail: (ev.tool_name || "") + " done", retireAt: null };
        break;
      case "Notification":
        newState = { ...base, kind: "approval", label: "Needs you!", detail: ev.message || "Approval required", retireAt: null };
        break;
      case "Stop":
      case "SubagentStop":
        newState = { ...base, kind: "done", label: "Done", detail: "Waiting for next message", retireAt: Date.now() + RETIRE_AFTER_MS };
        break;
      default:
        return;
    }
    sessions.set(key, newState);
    playTransitionSound(prevKind, newState.kind);
  }

  function render() {
    // Drop any session whose retirement time has passed.
    const now = Date.now();
    for (const [key, s] of sessions) {
      if (s.retireAt && s.retireAt <= now) sessions.delete(key);
    }

    container.querySelectorAll(".card").forEach((el) => el.remove());

    if (sessions.size === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const rows = [...sessions.entries()].sort((a, b) => (a[1].ts < b[1].ts ? 1 : -1));
    for (const [key, s] of rows) {
      const card = document.createElement("div");
      card.className = "card" + (s.kind === "approval" ? " needs-approval" : "");
      card.dataset.key = key;
      const st = statusFor(s.kind);
      const repoName = (s.cwd || "").split("/").filter(Boolean).pop() || "";
      // Stashed for the click-to-focus handler below — same folder name
      // shown in the .cwd label, used as the AppActivate match substring.
      card.dataset.repoName = repoName;
      // Full repo cwd, stashed on the card itself (not just the icon) so a
      // right-click anywhere on the card — not only precisely on the small
      // icon — can still resolve which repo's "Change icon" submenu to show.
      card.dataset.repo = s.cwd || "";
      const nameLine = s.name ? `<div class="name" title="${esc(s.name)}">${esc(s.name)}</div>` : "";
      card.innerHTML = `
        <div class="close" title="Remove from widget">✕</div>
        <div class="row">
          <div class="repoicon" data-repo="${esc(s.cwd)}" style="color:${iconColorFor(s.cwd)}">${iconSvgFor(s.cwd)}</div>
          <div class="body">
            <div class="status ${st.cls}">${st.ind}<span>${st.label}</span></div>
            ${nameLine}
            <div class="cwd">${esc(repoName)}</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    }

    // Ask the main process to size the window to fit the cards.
    requestAnimationFrame(() => {
      const h = Math.ceil(container.scrollHeight);
      if (window.pip.resize) window.pip.resize(h);
    });
  }

  window.pip.onEvents((events) => {
    events.forEach(applyEvent);
    render();
  });

  // Tray → "Clear all cards": wipe the in-memory session list.
  window.pip.onClear(() => {
    hintTimers.forEach((t) => clearTimeout(t));
    hintTimers.clear();
    sessions.clear();
    render();
  });

  // Sweep for retirements even when no new events arrive.
  setInterval(render, 30 * 1000);

  render();

  // --- Icon override, via native menus (main.js) --------------------------
  // Lets you override a repo's icon from the widget itself, instead of
  // hand-editing icon-map.json. Both entry points pop up an actual OS
  // context menu (built in main.js, since only the main process can call
  // Menu.popup) rather than a custom in-page control:
  //  - Left-click a card's icon: standalone icon-choice menu at the cursor.
  //  - Right-click a card's icon: the full menu, with "Change icon" as a
  //    nested submenu (only added when the click landed on an icon).
  // Either way, choosing an entry fires "set-icon" back here, and this
  // renderer — the sole writer of icon-map.json — applies and persists it.
  window.pip.onSetIcon((repoKeyStr, name) => {
    iconAssignments[repoKeyStr] = name;
    if (window.pip.saveIconMap) {
      window.pip.saveIconMap({ assignments: iconAssignments, nextIndex: nextIconIndex });
    }
    render();
  });

  // Click the ✕ to drop a session's card from the widget, or a card's icon
  // to open the icon-choice menu for that repo.
  container.addEventListener("click", (e) => {
    const iconEl = e.target.closest(".repoicon");
    if (iconEl) {
      window.pip.showIconMenu(repoKey(iconEl.dataset.repo));
      return;
    }
    const btn = e.target.closest(".close");
    if (!btn) return;
    const card = btn.closest(".card");
    if (card && card.dataset.key) {
      clearHint(card.dataset.key);
      sessions.delete(card.dataset.key);
      render();
    }
  });

  // Idle-pill quit button.
  const quitBtn = document.getElementById("quit");
  if (quitBtn) quitBtn.addEventListener("click", (e) => { e.stopPropagation(); window.pip.quit(); });

  // Right-click anywhere on the widget for the full menu (Clear all, Quit, …),
  // so the app is always controllable from the window, not just the tray icon.
  // Right-clicking anywhere on a card — not just precisely on its small icon
  // — also gets a "Change icon" submenu, so it's not a fiddly hit target.
  window.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const card = e.target.closest(".card");
    const repo = card ? card.dataset.repo : null;
    window.pip.showMenu(repo ? repoKey(repo) : null);
  });

  // Drag the frameless window from anywhere in the container — but a plain
  // click (no movement) on a card jumps to that repo's window instead. The
  // two are told apart by movement, not hold duration: if the cursor moves
  // past CLICK_MOVE_PX between mousedown and mouseup it's a drag, otherwise
  // it's a click, no matter how long the button was held. That's the
  // standard convention (File Explorer, browsers, …) and is more forgiving
  // than a duration threshold, which would misfire on a slow deliberate
  // click. The native "click" event isn't usable for this on its own: since
  // dragging moves the OS window (not the DOM), the DOM element under the
  // cursor at mouseup is unaffected by the drag, so a plain click listener
  // would fire "click" after every drag too — hence tracking this by hand.
  const CLICK_MOVE_PX = 4;
  let dragging = false, dragMoved = false, dragStartX = 0, dragStartY = 0, lastX = 0, lastY = 0;
  container.addEventListener("mousedown", (e) => {
    // Don't drag/click-navigate from buttons or the icon (icon click opens
    // its own menu instead) — returning here means dragging never becomes
    // true for these targets, so the mouseup handler below naturally skips
    // the click-to-focus logic for them too.
    if (e.target.closest(".close") || e.target.closest("#quit") || e.target.closest(".repoicon")) return;
    dragging = true; dragMoved = false;
    dragStartX = lastX = e.screenX; dragStartY = lastY = e.screenY;
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.screenX - lastX, dy = e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    window.pip.drag(dx, dy);
    if (!dragMoved && Math.hypot(e.screenX - dragStartX, e.screenY - dragStartY) > CLICK_MOVE_PX) {
      dragMoved = true;
    }
  });
  window.addEventListener("mouseup", (e) => {
    const wasClick = dragging && !dragMoved;
    dragging = false;
    if (!wasClick) return;
    const card = e.target.closest(".card");
    if (card && card.dataset.repoName) window.pip.focusRepo(card.dataset.repoName);
  });
</script>
</body>
</html>
